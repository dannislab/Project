
name: Deploy D3 Course

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 01_react_foundation/pokemon_collection/package-lock.json

      - name: Build Pokemon Collection
        working-directory: 01_react_foundation/pokemon_collection
        run: |
          npm ci
          npm run build

      - name: Assemble website
        run: |
          mkdir -p _site/01_react_foundation/pokemon_collection
          cp index.html _site/
          cp -r 00_webdev_foundation _site/
          cp -r 01_react_foundation/pokemon_collection/dist/. _site/01_react_foundation/pokemon_collection/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
